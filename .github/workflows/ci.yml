name: CI Pipeline

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main, development ]

env:
  NODE_VERSION: '18'
  PYTHON_VERSION: '3.11'
  ADMIN_USERNAME: 'saiyam0211'

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.changes.outputs.frontend }}
      backend: ${{ steps.changes.outputs.backend }}
      frontend-exists: ${{ steps.check-dirs.outputs.frontend-exists }}
      backend-exists: ${{ steps.check-dirs.outputs.backend-exists }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Check if directories exist
        id: check-dirs
        run: |
          echo "frontend-exists=$([ -d 'frontend' ] || [ -d 'client' ] || [ -d 'web' ] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          echo "backend-exists=$([ -d 'backend' ] || [ -d 'server' ] || [ -d 'api' ] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
      
      - uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - 'client/**'
              - 'web/**'
              - 'package.json'
              - '*.json'
            backend:
              - 'backend/**'
              - 'server/**'
              - 'api/**'
              - 'requirements.txt'
              - '*.py'

  frontend-ci:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend-exists == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        frontend-dir: [frontend, client, web]
    steps:
      - uses: actions/checkout@v4
      
      - name: Check if frontend directory exists
        id: check-dir
        run: |
          if [ -d "${{ matrix.frontend-dir }}" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "dir=${{ matrix.frontend-dir }}" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Setup Node.js
        if: steps.check-dir.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
        continue-on-error: true
      
      - name: Install dependencies
        if: steps.check-dir.outputs.exists == 'true'
        working-directory: ${{ steps.check-dir.outputs.dir }}
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci
          elif [ -f "yarn.lock" ]; then
            yarn install --frozen-lockfile
          elif [ -f "pnpm-lock.yaml" ]; then
            npm install -g pnpm
            pnpm install --frozen-lockfile
          else
            npm install
          fi
      
      - name: Run ESLint
        if: steps.check-dir.outputs.exists == 'true'
        working-directory: ${{ steps.check-dir.outputs.dir }}
        run: |
          if npm list eslint --depth=0 2>/dev/null; then
            npm run lint || npx eslint . --ext .js,.jsx,.ts,.tsx
          else
            echo "ESLint not found, skipping linting"
          fi
      
      - name: Run Prettier Check
        if: steps.check-dir.outputs.exists == 'true'
        working-directory: ${{ steps.check-dir.outputs.dir }}
        run: |
          if npm list prettier --depth=0 2>/dev/null; then
            npm run format:check || npx prettier --check .
          else
            echo "Prettier not found, skipping format check"
          fi
      
      - name: Run TypeScript Check
        if: steps.check-dir.outputs.exists == 'true'
        working-directory: ${{ steps.check-dir.outputs.dir }}
        run: |
          if [ -f "tsconfig.json" ]; then
            npx tsc --noEmit
          else
            echo "TypeScript config not found, skipping type check"
          fi
      
      - name: Run Tests
        if: steps.check-dir.outputs.exists == 'true'
        working-directory: ${{ steps.check-dir.outputs.dir }}
        run: |
          if npm run test --if-present; then
            npm run test
          else
            echo "No test script found, skipping tests"
          fi
      
      - name: Build Project
        if: steps.check-dir.outputs.exists == 'true'
        working-directory: ${{ steps.check-dir.outputs.dir }}
        run: |
          if npm run build --if-present; then
            npm run build
          else
            echo "No build script found, skipping build"
          fi
        env:
          CI: true

  backend-ci:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend-exists == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        backend-dir: [backend, server, api]
    steps:
      - uses: actions/checkout@v4
      
      - name: Check if backend directory exists
        id: check-dir
        run: |
          if [ -d "${{ matrix.backend-dir }}" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "dir=${{ matrix.backend-dir }}" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      
      # Node.js Backend Setup
      - name: Setup Node.js for Node backend
        if: steps.check-dir.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
        continue-on-error: true
      
      - name: Install Node.js dependencies
        if: steps.check-dir.outputs.exists == 'true'
        working-directory: ${{ steps.check-dir.outputs.dir }}
        run: |
          if [ -f "package.json" ]; then
            if [ -f "package-lock.json" ]; then
              npm ci
            elif [ -f "yarn.lock" ]; then
              yarn install --frozen-lockfile
            else
              npm install
            fi
          fi
        continue-on-error: true
      
      # Python Backend Setup
      - name: Setup Python for Python backend
        if: steps.check-dir.outputs.exists == 'true'
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
        continue-on-error: true
      
      - name: Install Python dependencies
        if: steps.check-dir.outputs.exists == 'true'
        working-directory: ${{ steps.check-dir.outputs.dir }}
        run: |
          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          elif [ -f "Pipfile" ]; then
            pip install pipenv
            pipenv install --dev
          elif [ -f "poetry.lock" ]; then
            pip install poetry
            poetry install
          fi
        continue-on-error: true
      
      # Linting for Node.js
      - name: Run ESLint (Node.js)
        if: steps.check-dir.outputs.exists == 'true'
        working-directory: ${{ steps.check-dir.outputs.dir }}
        run: |
          if [ -f "package.json" ] && npm list eslint --depth=0 2>/dev/null; then
            npm run lint || npx eslint . --ext .js,.jsx,.ts,.tsx
          fi
        continue-on-error: true
      
      # Linting for Python
      - name: Run Flake8 (Python)
        if: steps.check-dir.outputs.exists == 'true'
        working-directory: ${{ steps.check-dir.outputs.dir }}
        run: |
          if [ -f "requirements.txt" ] || [ -f "Pipfile" ] || [ -f "poetry.lock" ]; then
            pip install flake8
            flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
            flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
          fi
        continue-on-error: true
      
      - name: Run Black (Python)
        if: steps.check-dir.outputs.exists == 'true'
        working-directory: ${{ steps.check-dir.outputs.dir }}
        run: |
          if [ -f "requirements.txt" ] || [ -f "Pipfile" ] || [ -f "poetry.lock" ]; then
            pip install black
            black --check .
          fi
        continue-on-error: true
      
      # Testing
      - name: Run Tests (Node.js)
        if: steps.check-dir.outputs.exists == 'true'
        working-directory: ${{ steps.check-dir.outputs.dir }}
        run: |
          if [ -f "package.json" ]; then
            npm run test --if-present || echo "No test script found"
          fi
        continue-on-error: true
      
      - name: Run Tests (Python)
        if: steps.check-dir.outputs.exists == 'true'
        working-directory: ${{ steps.check-dir.outputs.dir }}
        run: |
          if [ -f "requirements.txt" ] || [ -f "Pipfile" ] || [ -f "poetry.lock" ]; then
            if [ -f "pytest.ini" ] || [ -f "pyproject.toml" ] || find . -name "test_*.py" | head -1; then
              pip install pytest
              pytest
            elif [ -f "manage.py" ]; then
              python manage.py test
            else
              echo "No test configuration found"
            fi
          fi
        continue-on-error: true

  security-scan:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend-exists == 'true' || needs.detect-changes.outputs.backend-exists == 'true'
    steps:
      - uses: actions/checkout@v4
      
      - name: Run npm audit (if Node.js project exists)
        run: |
          for dir in frontend client web backend server api; do
            if [ -d "$dir" ] && [ -f "$dir/package.json" ]; then
              echo "Running npm audit in $dir"
              cd "$dir"
              npm audit --audit-level=high
              cd ..
            fi
          done
        continue-on-error: true
      
      - name: Run Safety check (if Python project exists)
        run: |
          for dir in backend server api; do
            if [ -d "$dir" ] && [ -f "$dir/requirements.txt" ]; then
              echo "Running safety check in $dir"
              pip install safety
              cd "$dir"
              safety check -r requirements.txt
              cd ..
            fi
          done
        continue-on-error: true

  build-status:
    runs-on: ubuntu-latest
    needs: [detect-changes, frontend-ci, backend-ci, security-scan]
    if: always()
    steps:
      - name: Check build status
        run: |
          if [[ "${{ needs.frontend-ci.result }}" == "failure" || "${{ needs.backend-ci.result }}" == "failure" || "${{ needs.security-scan.result }}" == "failure" ]]; then
            echo "❌ CI Pipeline Failed"
            exit 1
          else
            echo "✅ CI Pipeline Passed"
          fi
      
      - name: Notify admin on failure
        if: failure() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚨 **CI Pipeline Failed** 
              
              @${{ env.ADMIN_USERNAME }} - Immediate attention required!
              
              **Branch:** ${{ github.ref_name }}
              **Commit:** ${{ github.sha }}
              **Actor:** ${{ github.actor }}
              
              Please check the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.`
            }) 